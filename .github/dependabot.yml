version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    assignees:
      - yamatt
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - github-actions
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - yamatt
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - python
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - yamatt
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - dependency
      - npm
